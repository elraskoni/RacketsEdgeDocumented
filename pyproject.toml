# Tool configuration only (the project is not packaged).

[tool.ruff]
target-version = "py310"
line-length = 140
include = [
	"services/api/**/*.py",
	"libs/**/*.py",
	"tests/**/*.py",
	"scripts/**/*.py",
	"config.py",
]

[tool.ruff.lint]
# Ruff defaults (pyflakes + pycodestyle errors): real bugs, not style.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
bdd_features_base_dir = "tests/acceptance/features"
markers = [
	"acceptance: BDD acceptance tests (need the test MySQL database)",
]
