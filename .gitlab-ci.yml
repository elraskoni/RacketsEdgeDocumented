# RacketEdge CI: lint -> test -> build.
# Run locally the same way: bash scripts/ci_local.sh (see docs/testing_and_ci.md).

stages:
  - lint
  - test
  - build

workflow:
  rules:
    # Merge request pipelines; branch pipelines only when no MR is open (no duplicates)
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

default:
  image: python:3.12-slim
  interruptible: true

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

.pip-cache:
  cache:
    key:
      files: [requirements.txt, requirements-dev.txt]
    paths: [.cache/pip]

lint:
  stage: lint
  extends: .pip-cache
  script:
    - pip install ruff==0.16.10
    # Machine-readable report for the merge request widget, then a readable run that sets the job status
    - ruff check --output-format=gitlab --output-file=gl-code-quality-report.json . || true
    - ruff check .
  artifacts:
    when: always
    reports:
      codequality: gl-code-quality-report.json

test:
  stage: test
  extends: .pip-cache
  services:
    - name: mysql:8.0
      alias: mysql
  variables:
    # mysql service: throwaway database for this job only
    MYSQL_ROOT_PASSWORD: test
    MYSQL_DATABASE: racketedge_test
    # read by tests/acceptance/conftest.py
    TEST_DB_HOST: mysql
    TEST_DB_PORT: "3306"
    TEST_DB_USER: root
    TEST_DB_PASSWORD: test
    TEST_DB_NAME: racketedge_test
  before_script:
    - apt-get update && apt-get install -y --no-install-recommends libgomp1 && rm -rf /var/lib/apt/lists/*
    - pip install -r requirements-dev.txt
  script:
    # Unit tests + BDD acceptance tests (tests/acceptance/features/*.feature)
    - python -m pytest --junitxml=reports/junit.xml -o junit_family=xunit2
  artifacts:
    when: always
    paths: [reports/]
    reports:
      junit: reports/junit.xml

build:
  stage: build
  image: docker:28
  services:
    - docker:28-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
    IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  script:
    - docker build --pull -t "$IMAGE" .
    # Publish to the project's container registry from the default branch only
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
        docker push "$IMAGE"
      fi
